<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Gamified Student Wallet - กระเป๋าเงินฝึกวินัยการเงินวัยเรียน</title>

  <!-- Google Fonts: Prompt & Kanit -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Prompt', 'Kanit', 'sans-serif'],
            display: ['Kanit', 'Prompt', 'sans-serif'],
          },
          colors: {
            cream: '#fffdf7',
            coin: '#fbbf24',
            mint: '#34d399',
            skybright: '#38bdf8',
          },
          boxShadow: {
            soft: '0 8px 24px -6px rgba(251, 191, 36, 0.16), 0 4px 10px -4px rgba(15, 23, 42, 0.05)',
            card: '0 6px 20px -4px rgba(15, 23, 42, 0.06)',
          }
        }
      }
    };
  </script>

  <style>
    /* Base Adaptive Full-Screen Styling & Custom Animations */
    html, body {
      width: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      background-color: #fffdf7;
      font-family: 'Prompt', 'Kanit', sans-serif;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }

    /* Gentle floating animation for coins and tree mascot */
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    .animate-float {
      animation: floatSlow 3s ease-in-out infinite;
    }

    /* Pop-in animation for modals and badges */
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.92) translateY(8px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .animate-pop {
      animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Shimmer effect on progress bar */
    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    .progress-shimmer::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.45), transparent);
      animation: shimmer 2.2s infinite;
    }

    /* Shake animation for incorrect PIN entry */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .animate-shake {
      animation: shake 0.32s ease-in-out;
    }

    /* Custom subtle scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #e5dec9;
      border-radius: 9999px;
    }

    /* Safe area support for modern mobile & iPad screens */
    .pt-safe {
      padding-top: max(0.75rem, env(safe-area-inset-top));
    }
    .pb-safe {
      padding-bottom: max(0.5rem, env(safe-area-inset-bottom));
    }
  </style>
</head>
<body class="w-full h-[100dvh] bg-[#fffdf7] overflow-hidden">

  <!-- Confetti Overlay Canvas -->
  <canvas id="confetti-canvas" class="fixed inset-0 pointer-events-none z-50"></canvas>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 w-[92%] max-w-md flex flex-col gap-2 pointer-events-none"></div>

  <!-- Full-Viewport Adaptive App Shell (Fits Mobile, iPad, Tablet & Desktop Edge-to-Edge) -->
  <div id="app-shell" class="w-full h-[100dvh] bg-[#fffdf7] flex flex-col relative overflow-hidden">

    <!-- Top Sticky App Header & Role Switcher -->
    <header class="sticky top-0 z-30 bg-[#fffdf7]/95 backdrop-blur-md px-4 sm:px-6 lg:px-8 pt-safe pb-3 border-b border-amber-100/80 shrink-0">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-2.5">
        <!-- Top Row: Brand & Utility Controls -->
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2.5">
            <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-[#fbbf24] to-amber-500 flex items-center justify-center text-white text-xl shadow-sm shrink-0">
              🪙
            </div>
            <div>
              <h1 class="font-display font-bold text-slate-800 text-base md:text-lg leading-tight">KidCoin Wallet</h1>
              <p class="text-[11px] md:text-xs text-slate-500 font-medium">กระเป๋าเงินฝึกวินัยการเงินวัยเรียน</p>
            </div>
          </div>

          <!-- Utility Buttons on Mobile -->
          <div class="flex md:hidden items-center gap-1.5">
            <button
              id="btn-toggle-sound-mobile"
              onclick="toggleSound()"
              title="เปิด/ปิดเสียงเอฟเฟกต์"
              class="p-2 rounded-xl bg-amber-50 hover:bg-amber-100 text-amber-700 text-sm transition active:scale-95 border border-amber-200/60"
            >
              🔊
            </button>
            <button
              onclick="openResetModal()"
              class="px-2.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-medium transition active:scale-95 flex items-center gap-1"
            >
              <span>🔄</span>
              <span>รีเซ็ต</span>
            </button>
          </div>
        </div>

        <!-- Role Switcher Tabs + iPad Utility Controls -->
        <div class="flex items-center gap-2.5">
          <div class="grid grid-cols-2 gap-1.5 p-1 bg-amber-100/70 rounded-2xl border border-amber-200/50 flex-1 md:w-80 lg:w-96">
            <button
              id="tab-student"
              onclick="switchMode('student')"
              class="py-2 px-3 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-200 flex items-center justify-center gap-1.5 shadow-sm bg-white text-slate-800"
            >
              <span>👦</span>
              <span>โหมดนักเรียน (ลูก)</span>
            </button>

            <button
              id="tab-parent"
              onclick="switchMode('parent')"
              class="relative py-2 px-3 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-200 flex items-center justify-center gap-1.5 text-slate-600 hover:text-slate-800"
            >
              <span>👨‍👩‍👧</span>
              <span>โหมดผู้ปกครอง</span>
              <span
                id="parent-pending-badge"
                class="hidden ml-0.5 px-1.5 py-0.5 text-[10px] font-bold bg-rose-500 text-white rounded-full animate-pulse"
              >
                0
              </span>
            </button>
          </div>

          <!-- Utility Buttons on iPad / Desktop -->
          <div class="hidden md:flex items-center gap-1.5">
            <button
              id="btn-toggle-sound-desktop"
              onclick="toggleSound()"
              title="เปิด/ปิดเสียงเอฟเฟกต์"
              class="p-2.5 rounded-xl bg-amber-50 hover:bg-amber-100 text-amber-700 text-sm transition active:scale-95 border border-amber-200/60"
            >
              🔊
            </button>
            <button
              onclick="openResetModal()"
              class="px-3 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-medium transition active:scale-95 flex items-center gap-1.5"
            >
              <span>🔄</span>
              <span>รีเซ็ตข้อมูลตัวอย่าง</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Adaptive Body Layout: Left Sidebar on iPad/Desktop + Scrollable Content + Bottom Nav on Mobile -->
    <div class="flex-1 flex flex-col md:flex-row min-h-0 overflow-hidden relative">

      <!-- iPad / Tablet / Desktop Left Navigation Sidebar -->
      <aside id="desktop-sidebar" class="hidden md:flex md:w-64 lg:w-72 bg-amber-50/45 border-r border-amber-100/80 p-4 lg:p-5 pb-safe flex-col justify-between shrink-0 overflow-y-auto">
        <!-- Sidebar Menus injected dynamically -->
      </aside>

      <!-- Main Dynamic Content Area -->
      <main id="main-content" class="flex-1 min-h-0 px-4 py-4 pb-24 sm:px-6 md:p-6 lg:p-8 overflow-y-auto overscroll-contain">
        <!-- Rendered via JavaScript -->
      </main>

    </div>

    <!-- Mobile Bottom Navigation Bar (Visible on Phone screens < 768px) -->
    <nav id="mobile-bottom-nav" class="md:hidden fixed bottom-0 inset-x-0 z-30 bg-white/95 backdrop-blur-md border-t border-amber-100 px-2 pt-1.5 pb-safe shadow-[0_-6px_20px_-6px_rgba(15,23,42,0.08)]">
      <!-- Bottom Nav Items injected dynamically -->
    </nav>

  </div>

  <!-- Custom Interactive Modal Container (Replaces alert/confirm) -->
  <div id="modal-backdrop" class="fixed inset-0 bg-slate-900/45 backdrop-blur-xs z-40 hidden items-end sm:items-center justify-center p-0 sm:p-4">
    <div id="modal-box" class="w-full max-w-md bg-white rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl animate-pop">
      <!-- Modal content injected dynamically -->
    </div>
  </div>

  <script>
    // =========================================================================
    // 1. WEB AUDIO API SOUND ENGINE (No external audio files needed)
    // =========================================================================
    const SoundFX = {
      ctx: null,
      enabled: true,

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            this.ctx = new AudioCtx();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },

      // Coin "ติ๊ง!" sound when approving a quest or dropping coins
      playCoin() {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;

          // First bright metallic chime (B5 -> E6)
          const osc1 = this.ctx.createOscillator();
          const gain1 = this.ctx.createGain();
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(987.77, now);
          osc1.frequency.setValueAtTime(1318.51, now + 0.085);

          gain1.gain.setValueAtTime(0.001, now);
          gain1.gain.exponentialRampToValueAtTime(0.28, now + 0.015);
          gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.55);

          osc1.connect(gain1);
          gain1.connect(this.ctx.destination);
          osc1.start(now);
          osc1.stop(now + 0.56);

          // Harmonic shimmer overtone
          const osc2 = this.ctx.createOscillator();
          const gain2 = this.ctx.createGain();
          osc2.type = 'triangle';
          osc2.frequency.setValueAtTime(1975.53, now);
          osc2.frequency.setValueAtTime(2637.02, now + 0.085);

          gain2.gain.setValueAtTime(0.001, now);
          gain2.gain.exponentialRampToValueAtTime(0.1, now + 0.015);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

          osc2.connect(gain2);
          gain2.connect(this.ctx.destination);
          osc2.start(now);
          osc2.stop(now + 0.46);
        } catch (e) {
          console.warn('Audio playback skipped:', e);
        }
      },

      // Celebration "เลเวลอัป!" fanfare when reaching 100% savings goal or unlocking allowance
      playLevelUp() {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const notes = [
            { freq: 523.25, start: 0.00, dur: 0.14 }, // C5
            { freq: 659.25, start: 0.11, dur: 0.14 }, // E5
            { freq: 783.99, start: 0.22, dur: 0.14 }, // G5
            { freq: 1046.50, start: 0.34, dur: 0.26 }, // C6
            { freq: 783.99, start: 0.56, dur: 0.14 }, // G5
            { freq: 1046.50, start: 0.70, dur: 0.55 }  // C6 long
          ];

          notes.forEach(n => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(n.freq, now + n.start);

            gain.gain.setValueAtTime(0.001, now + n.start);
            gain.gain.exponentialRampToValueAtTime(0.24, now + n.start + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, now + n.start + n.dur);

            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + n.start);
            osc.stop(now + n.start + n.dur + 0.02);
          });
        } catch (e) {
          console.warn('Audio playback skipped:', e);
        }
      },

      // Soft UI pop feedback
      playPop() {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(420, now);
          osc.frequency.exponentialRampToValueAtTime(620, now + 0.06);

          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.08);
        } catch (e) {}
      }
    };

    function toggleSound() {
      SoundFX.enabled = !SoundFX.enabled;
      const icon = SoundFX.enabled ? '🔊' : '🔇';
      const btnMobile = document.getElementById('btn-toggle-sound-mobile');
      const btnDesktop = document.getElementById('btn-toggle-sound-desktop');
      if (btnMobile) btnMobile.textContent = icon;
      if (btnDesktop) btnDesktop.textContent = icon;
      if (SoundFX.enabled) SoundFX.playPop();
      showToast(SoundFX.enabled ? 'เปิดเสียงเอฟเฟกต์แล้ว' : 'ปิดเสียงเอฟเฟกต์แล้ว', 'info');
    }

    // =========================================================================
    // 2. APPLICATION STATE & LOCALSTORAGE PERSISTENCE
    // =========================================================================
    const STORAGE_KEY = 'gamified_student_wallet_v1';

    function getDefaultState() {
      return {
        currentMode: 'student', // 'student' | 'parent'
        studentTab: 'overview', // 'overview' | 'goal' | 'quests' | 'history'
        parentTab: 'approvals', // 'approvals' | 'quests' | 'bonus' | 'history'
        parentPin: '1234', // รหัสผ่าน 4 หลักสำหรับเข้าโหมดผู้ปกครอง
        parentPinEnabled: true, // เปิดใช้งานการล็อกรหัสผ่านผู้ปกครอง
        studentName: 'น้องต้นกล้า',
        studentEmoji: '👦',
        studentAvatar: '', // รูปโปรไฟล์นักเรียน (Data URL)
        parentName: 'คุณแม่ใจดี',
        parentEmoji: '👩‍👧',
        parentAvatar: '', // รูปโปรไฟล์ผู้ปกครอง (Data URL)
        walletBalance: 40, // ยอดเงินคงเหลือปัจจุบันในกระเป๋า
        dailyAllowance: {
          amount: 50,
          unlocked: false
        },
        goal: {
          title: 'เก็บเงินซื้อหูฟังไร้สาย',
          targetAmount: 500,
          savedAmount: 180,
          emoji: '🎧'
        },
        matchingBonus: {
          bonus50Enabled: true,
          bonus50Amount: 50,
          bonus50Claimed: false,
          bonus100Enabled: true,
          bonus100Amount: 100,
          bonus100Claimed: false
        },
        quests: [
          {
            id: 'q1',
            title: 'อ่านหนังสือครบ 30 นาที',
            reward: 20,
            isMainUnlock: true,
            status: 'pending_approval', // 'available' | 'pending_approval' | 'approved'
            icon: '📚'
          },
          {
            id: 'q2',
            title: 'ทำการบ้านเสร็จก่อน 2 ทุ่ม',
            reward: 15,
            isMainUnlock: false,
            status: 'available',
            icon: '✏️'
          },
          {
            id: 'q3',
            title: 'ล้างจานหลังมื้อเย็น',
            reward: 15,
            isMainUnlock: false,
            status: 'available',
            icon: '🍽️'
          },
          {
            id: 'q4',
            title: 'เก็บที่นอนและจัดโต๊ะเรียน',
            reward: 10,
            isMainUnlock: false,
            status: 'approved',
            icon: '🛏️'
          }
        ],
        transactions: [
          {
            id: 't1',
            type: 'reward',
            title: 'รางวัลภารกิจ: เก็บที่นอนและจัดโต๊ะเรียน',
            amount: 10,
            time: 'วันนี้ 07:45 น.'
          },
          {
            id: 't2',
            type: 'goal_deposit',
            title: 'หยอดกระปุกเป้าหมาย: เก็บเงินซื้อหูฟังไร้สาย',
            amount: -30,
            time: 'เมื่อวาน 19:20 น.'
          }
        ]
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return getDefaultState();
        const parsed = JSON.parse(raw);
        const def = getDefaultState();
        return {
          ...def,
          ...parsed,
          dailyAllowance: { ...def.dailyAllowance, ...(parsed.dailyAllowance || {}) },
          goal: { ...def.goal, ...(parsed.goal || {}) },
          matchingBonus: { ...def.matchingBonus, ...(parsed.matchingBonus || {}) },
          quests: Array.isArray(parsed.quests) ? parsed.quests : def.quests,
          transactions: Array.isArray(parsed.transactions) ? parsed.transactions : def.transactions
        };
      } catch (e) {
        console.warn('Failed to load state from localStorage:', e);
        return getDefaultState();
      }
    }

    let appState = loadState();
    let isParentAuthenticated = false;
    let enteredPinBuffer = '';
    let isPinModalOpen = false;

    // หากเปิดระบบล็อกรหัสผ่านไว้ ให้เริ่มต้นที่โหมดนักเรียนเสมอเมื่อโหลดหน้าใหม่เพื่อความปลอดภัย
    if (appState.parentPinEnabled && appState.currentMode === 'parent') {
      appState.currentMode = 'student';
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (e) {
        console.warn('Failed to save state to localStorage:', e);
        showToast('พื้นที่จัดเก็บเต็ม รูปภาพอาจมีขนาดใหญ่เกินไป', 'warning');
      }
    }

    function getCurrentTimeLabel() {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      return `วันนี้ ${hh}:${mm} น.`;
    }

    // HTML Escape Helper to keep user inputs safe
    function escapeHTML(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Helper to render Student or Parent profile avatar (uploaded photo or fallback emoji)
    function renderAvatarHTML(role, extraClass = 'w-10 h-10 text-xl') {
      const isStudent = role === 'student';
      const avatarSrc = isStudent ? appState.studentAvatar : appState.parentAvatar;
      const fallbackEmoji = isStudent ? (appState.studentEmoji || '👦') : (appState.parentEmoji || '👩‍👧');

      if (avatarSrc) {
        return `
          <div class="${extraClass} rounded-2xl overflow-hidden bg-white flex items-center justify-center shrink-0 border border-white/70 shadow-xs">
            <img
              src="${avatarSrc}"
              alt="โปรไฟล์"
              class="w-full h-full object-cover"
              onerror="this.parentElement.innerHTML='${escapeHTML(fallbackEmoji)}'"
            />
          </div>
        `;
      }

      return `
        <div class="${extraClass} rounded-2xl bg-white/90 flex items-center justify-center shrink-0 shadow-xs">
          <span>${escapeHTML(fallbackEmoji)}</span>
        </div>
      `;
    }

    // =========================================================================
    // 3. UI HELPERS: TOASTS, MODALS & CONFETTI
    // =========================================================================
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const styles = {
        success: 'bg-emerald-600 text-white border-emerald-500',
        coin: 'bg-amber-500 text-slate-950 border-amber-400',
        warning: 'bg-rose-500 text-white border-rose-400',
        info: 'bg-slate-800 text-white border-slate-700'
      };
      const icons = {
        success: '✨',
        coin: '🪙',
        warning: '⚠️',
        info: '💡'
      };

      const toast = document.createElement('div');
      toast.className = `pointer-events-auto px-4 py-3 rounded-2xl shadow-lg border text-xs sm:text-sm font-semibold flex items-center gap-2.5 animate-pop ${styles[type] || styles.info}`;
      toast.innerHTML = `<span class="text-base shrink-0">${icons[type] || '✨'}</span><span>${escapeHTML(message)}</span>`;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-6px)';
        toast.style.transition = 'all 0.25s ease';
        setTimeout(() => toast.remove(), 260);
      }, 2800);
    }

    function openModal(htmlContent) {
      const backdrop = document.getElementById('modal-backdrop');
      const box = document.getElementById('modal-box');
      if (!backdrop || !box) return;
      box.innerHTML = htmlContent;
      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex');
    }

    function closeModal() {
      const backdrop = document.getElementById('modal-backdrop');
      isPinModalOpen = false;
      enteredPinBuffer = '';
      if (!backdrop) return;
      backdrop.classList.add('hidden');
      backdrop.classList.remove('flex');
    }

    function openResetModal() {
      SoundFX.playPop();
      openModal(`
        <div class="space-y-4 text-center">
          <div class="w-14 h-14 rounded-3xl bg-amber-100 text-amber-600 text-3xl flex items-center justify-center mx-auto">
            🔄
          </div>
          <div>

            <p class="text-xs sm:text-sm text-slate-500 mt-1">

    // Celebratory Confetti Effect
    function launchConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const colors = ['#fbbf24', '#34d399', '#38bdf8', '#f472b6', '#a78bfa'];
      const particles = Array.from({ length: 75 }, () => ({
        x: Math.random() * canvas.width,
        y: -20 - Math.random() * 120,
        size: 6 + Math.random() * 6,
        color: colors[Math.floor(Math.random() * colors.length)],
        vx: (Math.random() - 0.5) * 4,
        vy: 2.5 + Math.random() * 4,
        rot: Math.random() * Math.PI * 2,
        vrot: (Math.random() - 0.5) * 0.2
      }));

      let frame = 0;
      function tick() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.rot += p.vrot;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
          ctx.restore();
        });
        frame++;
        if (frame < 110) {
          requestAnimationFrame(tick);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
      requestAnimationFrame(tick);
    }

    function handleDepositToGoal(event) {
      event.preventDefault();
      const input = document.getElementById('deposit-amount-input');
      const amount = parseInt(input ? input.value : '0', 10);

      if (isNaN(amount) || amount <= 0) {
        showToast('กรุณาระบุจำนวนเงินให้ถูกต้อง', 'warning');
        return;
      }
      if (amount > appState.walletBalance) {
        showToast('ยอดเงินในกระเป๋าไม่เพียงพอ', 'warning');
        return;
      }

      appState.walletBalance -= amount;
      appState.goal.savedAmount += amount;
      appState.transactions.unshift({
        id: 't_' + Date.now(),
        type: 'goal_deposit',
        title: `หยอดกระปุกเป้าหมาย: ${appState.goal.title}`,
        amount: -amount,
        time: getCurrentTimeLabel()
      });

      // Check Parent Matching Bonus Milestones (50% and 100%)
      const pct = (appState.goal.savedAmount / appState.goal.targetAmount) * 100;
      let triggeredMilestone = false;

      if (
        appState.matchingBonus.bonus50Enabled &&
        !appState.matchingBonus.bonus50Claimed &&
        pct >= 50
      ) {
        const bonus50 = Number(appState.matchingBonus.bonus50Amount) || 0;
        appState.matchingBonus.bonus50Claimed = true;
        if (bonus50 > 0) {
          appState.goal.savedAmount += bonus50;
          appState.transactions.unshift({
            id: 't_b50_' + Date.now(),
            type: 'bonus',
            title: `โบนัสสมทบจากผู้ปกครอง (ออมถึง 50%!)`,
            amount: bonus50,
            time: getCurrentTimeLabel()
          });
          triggeredMilestone = true;
          setTimeout(() => {
            showToast(`เย้! ออมถึง 50% ผู้ปกครองสมทบเพิ่ม +${bonus50} บาท!`, 'coin');
          }, 400);
        }
      }

      const finalPct = (appState.goal.savedAmount / appState.goal.targetAmount) * 100;
      if (
        appState.matchingBonus.bonus100Enabled &&
        !appState.matchingBonus.bonus100Claimed &&
        finalPct >= 100
      ) {
        const bonus100 = Number(appState.matchingBonus.bonus100Amount) || 0;
        appState.matchingBonus.bonus100Claimed = true;
        if (bonus100 > 0) {
          appState.goal.savedAmount += bonus100;
          appState.transactions.unshift({
            id: 't_b100_' + Date.now(),
            type: 'bonus',
            title: `โบนัสพิชิตเป้าหมาย 100% จากผู้ปกครอง!`,
            amount: bonus100,
            time: getCurrentTimeLabel()
          });
        }
        triggeredMilestone = true;
        SoundFX.playLevelUp();
        launchConfetti();
        setTimeout(() => {
          showToast(`🎉 ยินดีด้วย! พิชิตเป้าหมาย "${appState.goal.title}" สำเร็จ 100% แล้ว!`, 'success');
        }, 500);
      } else if (triggeredMilestone || finalPct >= 100) {
        SoundFX.playLevelUp();
        launchConfetti();
      } else {
        SoundFX.playCoin();
        showToast(`หยอดกระปุกออมเงินเพิ่ม +${amount} บาท สำเร็จ!`, 'coin');
      }

      saveState();
      closeModal();
      renderApp();
    }

      appState.walletBalance += quest.reward;
      appState.transactions.unshift({
        id: 't_q_' + Date.now(),
        type: 'reward',
        title: `รางวัลภารกิจ: ${quest.title}`,
        amount: quest.reward,
        time: getCurrentTimeLabel()
      });

      let unlockedNow = false;
      if (quest.isMainUnlock && !appState.dailyAllowance.unlocked) {
        appState.dailyAllowance.unlocked = true;
        const allowAmt = Number(appState.dailyAllowance.amount) || 0;
        appState.walletBalance += allowAmt;
        appState.transactions.unshift({
          id: 't_alw_' + Date.now(),
          type: 'allowance',
          title: `ปลดล็อกค่าขนมประจำวันสำเร็จ!`,
          amount: allowAmt,
          time: getCurrentTimeLabel()

        unlockedNow = true;
      }

      if (unlockedNow) {
        SoundFX.playLevelUp();
        launchConfetti();
        showToast(
          `อนุมัติแล้ว! ปลดล็อกค่าขนม +${appState.dailyAllowance.amount}฿ และรับรางวัล +${quest.reward}฿!`,

    function handleProfileImageUpload(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          // Resize & crop square to 180x180 JPEG so LocalStorage stays lightweight
          const size = 180;
          const canvas = document.createElement('canvas');
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');

          const minSide = Math.min(img.width, img.height);
          const sx = (img.width - minSide) / 2;
          const sy = (img.height - minSide) / 2;
          ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);

          tempAvatarDataUrl = canvas.toDataURL('image/jpeg', 0.82);
          SoundFX.playPop();
          updateProfilePreviewUI();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function handleResetStudentMoney(event) {
      event.preventDefault();
      const walletInput = document.getElementById('reset-wallet-amount');
      const resetGoalCheck = document.getElementById('reset-goal-savings');
      const resetAllowanceCheck = document.getElementById('reset-daily-allowance-lock');

      const newWalletBalance = parseInt(walletInput ? walletInput.value : '0', 10);
      if (isNaN(newWalletBalance) || newWalletBalance < 0) {
        showToast('กรุณาระบุจำนวนเงินให้ถูกต้อง', 'warning');
        return;
      }

      const prevWallet = appState.walletBalance;
      const diff = newWalletBalance - prevWallet;
      appState.walletBalance = newWalletBalance;

      appState.transactions.unshift({
        id: 't_reset_w_' + Date.now(),
        type: 'goal_deposit',
        title: `ผู้ปกครองรีเซ็ตยอดเงินกระเป๋าเป็น ${newWalletBalance.toLocaleString()} บาท`,
        amount: diff,
        time: getCurrentTimeLabel()
      });

      if (resetGoalCheck && resetGoalCheck.checked) {
        const prevSaved = appState.goal.savedAmount;
        appState.goal.savedAmount = 0;
        appState.matchingBonus.bonus50Claimed = false;
        appState.matchingBonus.bonus100Claimed = false;
        if (prevSaved > 0) {
          appState.transactions.unshift({
            id: 't_reset_g_' + Date.now(),
            type: 'goal_deposit',
            title: `ผู้ปกครองรีเซ็ตยอดออมเป้าหมายเป็น 0 บาท`,
            amount: -prevSaved,
            time: getCurrentTimeLabel()
          });
        }
      }

      if (resetAllowanceCheck && resetAllowanceCheck.checked) {
        appState.dailyAllowance.unlocked = false;
      }

      SoundFX.playPop();
      saveState();
      closeModal();
      renderApp();
      showToast(`รีเซ็ตยอดเงินของ${appState.studentName}เรียบร้อยแล้ว!`, 'info');
    }

          dot.className = 'w-4 h-4 rounded-full border-2 border-sky-500 bg-sky-500 scale-110 transition-all duration-150';

    function pressPinDigit(digit) {
      if (enteredPinBuffer.length >= 4) return;
      SoundFX.playPop();
      enteredPinBuffer += digit;
      const errEl = document.getElementById('pin-error-msg');
      if (errEl) errEl.textContent = '';
      updatePinDotsUI();

      if (enteredPinBuffer.length === 4) {
        setTimeout(() => {
          if (enteredPinBuffer === appState.parentPin) {
            isParentAuthenticated = true;
            appState.currentMode = 'parent';
            SoundFX.playCoin();
            closeModal();
            saveState();
            renderApp();
            showToast('ยืนยันรหัสผ่านสำเร็จ! เข้าสู่โหมดผู้ปกครองแล้ว', 'success');
          } else {
            const container = document.getElementById('pin-modal-container');
            const errMsg = document.getElementById('pin-error-msg');
            if (errMsg) errMsg.textContent = '❌ รหัสผ่านไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง';
            if (container) {
              container.classList.remove('animate-shake');
              void container.offsetWidth;
              container.classList.add('animate-shake');
            }
            enteredPinBuffer = '';
            updatePinDotsUI();
          }
        }, 120);
      }
    }

    function backspacePin() {
      if (enteredPinBuffer.length === 0) return;
      SoundFX.playPop();

      const clamped = Math.max(0, Math.min(100, percent));

      const showFruits = clamped >= 85;

      return `
        <div class="relative w-24 h-24 sm:w-28 sm:h-28 flex items-center justify-center animate-float shrink-0">

            <rect x="37" y="81" width="46" height="7" rx="3.5" fill="#fbbf24" />

              <path d="M55 82 Q57 60 60 46 Q63 60 65 82 Z" fill="#92400e" />
              <!-- Leafy Crown -->
              <circle cx="60" cy="40" r="24" fill="#34d399" />
              <circle cx="43" cy="47" r="16" fill="#10b981" />

                <circle cx="74" cy="35" r="4" fill="#fef08a" />
                <circle cx="60" cy="22" r="4" fill="#fbcfe8" />

                <circle cx="71" cy="48" r="5.5" fill="#fbbf24" stroke="#fff" stroke-width="1.5" />

              `).join('')}
            </div>
          `}
        </section>
      `;

      const manageQuestsSection = `
        <section class="grid grid-cols-1 lg:grid-cols-2 gap-5 items-start">
          <!-- Add New Quest Form -->
          <form onsubmit="handleCreateQuest(event)" class="bg-white rounded-3xl p-5 shadow-card border border-sky-100 space-y-4">
            <h3 class="font-display font-bold text-slate-800 text-base sm:text-lg flex items-center gap-2">
              <span>➕</span>
              <span>สร้างภารกิจใหม่ให้ลูก</span>
            </h3>

            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">ชื่อภารกิจ</label>
              <input
                id="new-quest-title"
                type="text"
                required
                maxlength="50"
                placeholder="เช่น ซ้อมเปียโน 20 นาที, รดน้ำต้นไม้"
                class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:border-sky-400 focus:outline-none text-sm text-slate-800"
              />
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">เงินรางวัล (บาท)</label>
                <input
                  id="new-quest-reward"
                  type="number"
                  min="1"
                  max="5000"
                  required
                  value="20"
                  class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:border-sky-400 focus:outline-none text-sm font-bold text-slate-800"
                />
              </div>

              <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">ไอคอนภารกิจ</label>
                <select
                  id="new-quest-icon"
                  class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:border-sky-400 focus:outline-none text-sm bg-white"
                >
                  <option value="📚">📚 อ่านหนังสือ / เรียน</option>
                  <option value="🧹">🧹 งานบ้าน / ทำความสะอาด</option>
                  <option value="🎹">🎹 ฝึกซ้อมดนตรี / กีฬา</option>
                  <option value="🐶">🐶 ดูแลสัตว์เลี้ยง</option>
                  <option value="🌱">🌱 รดน้ำต้นไม้</option>
                  <option value="⭐">⭐ ภารกิจพิเศษ</option>
                </select>
              </div>
            </div>

            <label class="flex items-center gap-2.5 p-3 rounded-2xl bg-amber-50/80 border border-amber-200/70 cursor-pointer">
              <input
                id="new-quest-unlock"
                type="checkbox"
                class="w-4 h-4 accent-amber-500 rounded"
              />
              <span class="text-xs font-semibold text-amber-900">
                🔑 ตั้งเป็นภารกิจหลักสำหรับปลดล็อกค่าขนมประจำวัน (${appState.dailyAllowance.amount}฿)
              </span>
            </label>

            <button
              type="submit"
              class="w-full py-3 rounded-2xl bg-sky-500 hover:bg-sky-600 text-white font-bold text-sm shadow-sm transition active:scale-[0.98]"
            >
              ➕ เพิ่มภารกิจเข้าระบบ
            </button>
          </form>

          <!-- All Existing Quests -->
          <div class="bg-white rounded-3xl p-5 shadow-card border border-slate-100 space-y-3">
            <h3 class="font-display font-bold text-slate-800 text-base sm:text-lg">
              รายการภารกิจทั้งหมด (${appState.quests.length})
            </h3>
            <div class="space-y-2.5">
              ${appState.quests.map(q => `
                <div class="p-3 rounded-2xl bg-slate-50/80 border border-slate-100 flex items-center justify-between gap-2">
                  <div class="flex items-center gap-2.5 min-w-0">
                    <span class="text-xl shrink-0">${escapeHTML(q.icon || '⭐')}</span>
                    <div class="min-w-0">
                      <p class="text-xs sm:text-sm font-semibold text-slate-800 truncate">${escapeHTML(q.title)}</p>
                      <p class="text-[11px] text-slate-500">
                        +${q.reward}฿ ${q.isMainUnlock ? '• 🔑 ปลดล็อกค่าขนม' : ''}
                      </p>
                    </div>
                  </div>
                  <button
                    onclick="deleteQuest('${q.id}')"
                    title="ลบภารกิจ"
                    class="p-2 rounded-xl hover:bg-rose-50 text-slate-400 hover:text-rose-500 text-xs transition shrink-0"
                  >
                    🗑️
                  </button>
                </div>
              `).join('')}
            </div>
          </div>
        </section>
      `;

      const bonusAndAllowanceSection = `
        <div class="max-w-2xl mx-auto space-y-5">
          <!-- Student Wallet Reset Card -->
          <div class="bg-white rounded-3xl p-5 shadow-card border border-rose-100 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h3 class="font-display font-bold text-slate-800 text-base flex items-center gap-2">
                <span>💼</span>
                <span>จัดการและรีเซ็ตยอดเงินของ${escapeHTML(appState.studentName)}</span>
              </h3>
              <p class="text-xs text-slate-500 mt-1">
                ยอดคงเหลือปัจจุบัน: <strong class="text-amber-600">${appState.walletBalance.toLocaleString()} บาท</strong> • เงินออมเป้าหมาย: <strong class="text-emerald-600">${appState.goal.savedAmount.toLocaleString()} บาท</strong>
              </p>
            </div>
            <button
              type="button"
              onclick="openResetStudentMoneyModal()"
              class="px-4 py-2.5 rounded-2xl bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 font-bold text-xs transition active:scale-95 shrink-0 flex items-center justify-center gap-1.5"
            >
              <span>🔄</span>
              <span>รีเซ็ตยอดเงินลูก</span>
            </button>
          </div>

          <form onsubmit="handleSaveParentSettings(event)" class="bg-white rounded-3xl p-5 shadow-card border border-sky-100 space-y-5">
          <div>
            <h3 class="font-display font-bold text-slate-800 text-base sm:text-lg flex items-center gap-2">
              <span>🎁</span>
              <span>ตั้งค่าค่าขนม & โบนัสสมทบเงินออม (Parent Matching Bonus)</span>
            </h3>
            <p class="text-xs text-slate-500 mt-1">
              สร้างแรงจูงใจให้ลูกออมเงินต่อเนื่อง ด้วยโบนัสสมทบอัตโนมัติเมื่อออมถึง 50% และ 100% ของเป้าหมาย
            </p>
          </div>

          <!-- Daily Allowance Setting -->
          <div class="p-4 rounded-2xl bg-amber-50/70 border border-amber-200/70 space-y-2">
            <label class="block text-xs font-bold text-amber-900">
              🪙 ค่าขนมประจำวัน (ปลดล็อกเมื่อทำภารกิจหลักสำเร็จ)
            </label>
            <div class="flex items-center gap-2">
              <input
                id="setting-allowance-amount"
                type="number"
                min="0"
                max="5000"
                value="${appState.dailyAllowance.amount}"
                class="w-36 px-3.5 py-2 rounded-xl border border-amber-200 bg-white text-sm font-bold text-slate-800"
              />
              <span class="text-xs font-semibold text-slate-600">บาท / วัน</span>
            </div>
          </div>

          <!-- 50% Matching Bonus -->
          <div class="p-4 rounded-2xl bg-emerald-50/60 border border-emerald-200/70 space-y-2.5">
            <label class="flex items-center justify-between cursor-pointer">
              <span class="text-xs sm:text-sm font-bold text-emerald-900">
                🌱 โบนัสเมื่อออมถึง 50% ของเป้าหมาย
              </span>
              <input
                id="setting-b50-enabled"
                type="checkbox"
                ${appState.matchingBonus.bonus50Enabled ? 'checked' : ''}
                class="w-4 h-4 accent-emerald-500"
              />
            </label>
            <div class="flex items-center gap-2">
              <span class="text-xs text-slate-600">สมทบเพิ่ม:</span>
              <input
                id="setting-b50-amount"
                type="number"
                min="0"
                max="10000"
                value="${appState.matchingBonus.bonus50Amount}"
                class="w-32 px-3 py-1.5 rounded-xl border border-emerald-200 bg-white text-sm font-bold text-slate-800"
              />
              <span class="text-xs font-semibold text-slate-600">บาท</span>
              ${appState.matchingBonus.bonus50Claimed ? '<span class="text-[11px] text-emerald-600 font-bold">(รับโบนัสแล้ว ✓)</span>' : ''}
            </div>
          </div>

          <!-- 100% Matching Bonus -->
          <div class="p-4 rounded-2xl bg-sky-50/60 border border-sky-200/70 space-y-2.5">
            <label class="flex items-center justify-between cursor-pointer">
              <span class="text-xs sm:text-sm font-bold text-sky-900">
                🏆 โบนัสเมื่อออมครบ 100% ของเป้าหมาย
              </span>
              <input
                id="setting-b100-enabled"
                type="checkbox"
                ${appState.matchingBonus.bonus100Enabled ? 'checked' : ''}
                class="w-4 h-4 accent-sky-500"
              />
            </label>
            <div class="flex items-center gap-2">
              <span class="text-xs text-slate-600">สมทบเพิ่ม:</span>
              <input
                id="setting-b100-amount"
                type="number"
                min="0"
                max="10000"
                value="${appState.matchingBonus.bonus100Amount}"
                class="w-32 px-3 py-1.5 rounded-xl border border-sky-200 bg-white text-sm font-bold text-slate-800"
              />
              <span class="text-xs font-semibold text-slate-600">บาท</span>
              ${appState.matchingBonus.bonus100Claimed ? '<span class="text-[11px] text-sky-600 font-bold">(รับโบนัสแล้ว ✓)</span>' : ''}
            </div>
          </div>

          <!-- Parent Mode PIN Security Setting -->
          <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200/80 space-y-2.5">
            <label class="flex items-center justify-between cursor-pointer">
              <span class="text-xs sm:text-sm font-bold text-slate-800">
                🔐 ล็อกโหมดผู้ปกครองด้วยรหัสผ่าน (PIN 4 หลัก)
              </span>
              <input
                id="setting-parent-pin-enabled"
                type="checkbox"
                ${appState.parentPinEnabled ? 'checked' : ''}
                class="w-4 h-4 accent-sky-500"
              />
            </label>
            <div class="flex flex-wrap items-center gap-2">
              <span class="text-xs text-slate-600">รหัสผ่านปัจจุบัน: <strong class="text-slate-800">${escapeHTML(appState.parentPin)}</strong></span>
              <input
                id="setting-parent-pin"
                type="password"
                inputmode="numeric"
                maxlength="4"
                placeholder="เปลี่ยนรหัส 4 หลักใหม่"
                class="w-44 px-3 py-1.5 rounded-xl border border-slate-200 bg-white text-sm font-bold text-slate-800 tracking-widest"
              />
            </div>
          </div>

          <button
            type="submit"
            class="w-full py-3 rounded-2xl bg-sky-500 hover:bg-sky-600 text-white font-bold text-sm shadow-sm transition active:scale-[0.98]"
          >
            💾 บันทึกการตั้งค่า
          </button>
          </form>
        </div>
      `;

      if (tab === 'quests') {
        return `<div class="max-w-5xl mx-auto space-y-5">${summaryBanner}${manageQuestsSection}</div>`;
      }
      if (tab === 'bonus') {
        return `<div class="max-w-5xl mx-auto space-y-5">${summaryBanner}${bonusAndAllowanceSection}</div>`;
      }
      if (tab === 'history') {
        return `<div class="max-w-3xl mx-auto space-y-5">${summaryBanner}${renderHistorySection()}</div>`;
      }

      // Default: 'approvals'
      return `
        <div class="max-w-5xl mx-auto space-y-5">
          ${summaryBanner}
          ${approvalsSection}
        </div>
      `;
    }

    // =========================================================================
    // 11. MAIN RENDER ORCHESTRATOR
    // =========================================================================
    function renderApp() {
      const tabStudent = document.getElementById('tab-student');
      const tabParent = document.getElementById('tab-parent');
      const pendingBadge = document.getElementById('parent-pending-badge');
      const mainContent = document.getElementById('main-content');

      // Update Top Role Switcher Tabs
      const isStudent = appState.currentMode === 'student';
      if (tabStudent && tabParent) {
        if (isStudent) {
          tabStudent.className = 'py-2 px-3 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-200 flex items-center justify-center gap-1.5 shadow-sm bg-white text-slate-800';
          tabParent.className = 'relative py-2 px-3 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-200 flex items-center justify-center gap-1.5 text-slate-600 hover:text-slate-800';
        } else {
          tabStudent.className = 'py-2 px-3 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-200 flex items-center justify-center gap-1.5 text-slate-600 hover:text-slate-800';
          tabParent.className = 'relative py-2 px-3 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-200 flex items-center justify-center gap-1.5 shadow-sm bg-white text-sky-700';
        }
      }

      // Update Pending Approvals Badge
      const pendingCount = appState.quests.filter(q => q.status === 'pending_approval').length;
      if (pendingBadge) {
        if (pendingCount > 0) {
          pendingBadge.textContent = pendingCount;
          pendingBadge.classList.remove('hidden');
        } else {
          pendingBadge.classList.add('hidden');
        }
      }

      // Render Side/Bottom Navigation
      renderNavigation();

      // Render Main View Content
      if (mainContent) {
        mainContent.innerHTML = isStudent ? renderStudentView() : renderParentView();
      }
    }

    // Close modal when tapping outside modal box
    document.getElementById('modal-backdrop').addEventListener('click', function(e) {
      if (e.target === this) {
        closeModal();
      }
    });

    // Keyboard support for Parent PIN Keypad
    document.addEventListener('keydown', function(e) {
      if (!isPinModalOpen) return;
      if (e.key >= '0' && e.key <= '9') {
        pressPinDigit(e.key);
      } else if (e.key === 'Backspace') {
        backspacePin();
      } else if (e.key === 'Escape') {
        closeModal();
      }
    });

    // Initialize Application on Window Load
    window.onload = function() {
      renderApp();
    };
  </script>
</body>
</html>
